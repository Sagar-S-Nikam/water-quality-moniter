spring.application.name=watermonitor
# Database URL (change 'water_monitor_db' to your actual DB name)
spring.datasource.url=jdbc:mysql://localhost:3306/watermonitor

# Database Credentials
spring.datasource.username=root
spring.datasource.password=root

# Hibernate settings
# 'update' will automatically create/update your tables based on your WaterData entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8081